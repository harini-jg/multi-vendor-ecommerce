spring.application.name=backend

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:multivendor_db}

spring.datasource.username=${MYSQLUSER:multivendor_user}

spring.datasource.password=${MYSQLPASSWORD:multivendor123}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

server.port=${PORT:8080}